syntax = "proto3";

package apollo.v1;

import "common.proto";

// =============================================================================
// Webhook service — implemented by the RECEIVER, called by the apollo server.
//
// The apollo server is the client here, calling the receiver configured by
// [webhook].url. TaskStatus fires when the task's input reaches a terminal state
// (Task.result is `models`, `error`, or `state: CANCELLED`) and, best-effort, on
// intermediate transitions (processing, retrying — reported as PROCESSING). The
// message always carries the full current Task. Delivery of the terminal update
// is at-least-once, so receivers should dedupe by Task.id. When the server is
// configured with a secret, each call is signed: `x-apollo-webhook-timestamp`
// (unix seconds) and `x-apollo-webhook-signature` = "v1=" + lowercase-hex
// HMAC-SHA256(secret, "<timestamp>." + the encoded Task bytes as sent). See
// docs/webhooks.md for verification.
// =============================================================================

service Webhook {
  rpc TaskStatus (Task) returns (Ack);
}
