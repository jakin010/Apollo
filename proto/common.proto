syntax = "proto3";

package apollo.v1;

import "google/protobuf/timestamp.proto";

// =============================================================================
// Shared messages and enums for the apollo.v1 services.
//
// This file defines no services; it is imported by both `inference.proto` (the
// `Inference` service the apollo server implements) and `webhook.proto` (the
// `Webhook` service a receiver implements). Keeping the messages here lets each
// service compile a self-contained FileDescriptorSet for reflection without the
// two services leaking into each other's schema.
// =============================================================================

// ---------------------------------- inputs -----------------------------------

// A media input: what kind it is, and where its bytes come from. Text cannot
// come from a `url`.
message Media {
  MediaKind kind = 1;
  oneof source {
    // Local path, `file://`, or `http(s)://`.
    string url = 2;
    // The content itself. Bounded by the gRPC message size (4 MiB by default);
    // stream larger files with `ClassifyStream`.
    bytes data = 3;
  }
  // Tried only if `url` cannot be fetched or decoded.
  string fallback_url = 4;
}

enum MediaKind {
  MEDIA_KIND_UNSPECIFIED = 0;
  MEDIA_KIND_IMAGE = 1;
  MEDIA_KIND_VIDEO = 2;
  MEDIA_KIND_AUDIO = 3;
  // UTF-8 text: as `data`, or streamed. (Inline text can also be sent as
  // `ClassifyRequest.text`.)
  MEDIA_KIND_TEXT = 4;
}

// Models to run on one input, concurrently.
message ModelList {
  repeated string names = 1;
}

// How much of a scan result to return.
enum ResultView {
  // Same as SUMMARY.
  RESULT_VIEW_UNSPECIFIED = 0;
  // The aggregated result and segments; per-sample results are left out.
  RESULT_VIEW_SUMMARY = 1;
  // Everything, including every classified sample.
  RESULT_VIEW_FULL = 2;
}

// ---------------------------------- results ----------------------------------

// One submitted input and everything known about it.
message Task {
  string id = 1;
  TaskState state = 2;
  // Why the task failed, when `state` is FAILED (e.g. the input could not be
  // fetched). Individual model failures are reported on their result instead.
  Error error = 3;
  // One entry per model, in run order (pipeline order, or as requested), each
  // with its own state; outputs appear as models complete.
  repeated ModelResult results = 4;
  // The pipeline the input runs through; empty for a plain set of models.
  string pipeline = 5;
  // The client's metadata from the request, unchanged.
  map<string, string> metadata = 6;
  // The client's idempotency key from the request, if any.
  string request_id = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  // Unset until the task is COMPLETED, FAILED or CANCELLED.
  google.protobuf.Timestamp finished_at = 10;
  Progress progress = 11;
  // Times the task was retried after a transient failure.
  uint32 retries = 12;
}

enum TaskState {
  TASK_STATE_UNSPECIFIED = 0;
  TASK_STATE_QUEUED = 1;
  // Running, or waiting to retry after a transient failure.
  TASK_STATE_PROCESSING = 2;
  // Every model finished; check each result's state (one may have failed).
  TASK_STATE_COMPLETED = 3;
  // The task as a whole failed; see `Task.error`.
  TASK_STATE_FAILED = 4;
  // Cancelled by a client.
  TASK_STATE_CANCELLED = 5;
}

// How many of the task's models have finished (completed, failed or skipped).
message Progress {
  uint32 models_total = 1;
  uint32 models_finished = 2;
}

// The outcome of one model on the task's input.
message ModelResult {
  // The model's name, as configured.
  string model = 1;
  ModelState state = 2;
  // Why the model failed, when `state` is FAILED.
  Error error = 3;
  // Set when `state` is COMPLETED.
  oneof output {
    // An image (or other single input) classified once.
    Classification classification = 4;
    // An image classifier run over a video's sampled frames, or a text
    // classifier over the parts of a video's text.
    Scan scan = 5;
    // The text a model read (OCR), from an image or a video's sampled frames.
    TextOutput text = 6;
  }
}

enum ModelState {
  MODEL_STATE_UNSPECIFIED = 0;
  MODEL_STATE_QUEUED = 1;
  MODEL_STATE_PROCESSING = 2;
  MODEL_STATE_COMPLETED = 3;
  MODEL_STATE_FAILED = 4;
  // Not run because an earlier pipeline step's gate fired.
  MODEL_STATE_SKIPPED = 5;
  // Not finished because the task was cancelled.
  MODEL_STATE_CANCELLED = 6;
}

// A structured error. `kind` categorizes it for programmatic handling; `message`
// carries human-readable detail. A purely ad-hoc error uses
// ERROR_TYPE_UNSPECIFIED with the text in `message`.
message Error {
  ErrorType kind = 1;
  string message = 2;
}

enum ErrorType {
  ERROR_TYPE_UNSPECIFIED = 0;        // uncategorized / custom (see message)
  ERROR_TYPE_FETCH = 1;              // the input could not be fetched
  ERROR_TYPE_DECODE = 2;             // fetched, but could not be decoded
  ERROR_TYPE_INFERENCE = 3;          // a model failed during inference
  ERROR_TYPE_TIMEOUT = 4;            // an operation exceeded its deadline
  ERROR_TYPE_CANCELLED = 5;          // the task was cancelled
  ERROR_TYPE_MODEL_UNAVAILABLE = 6;  // a model could not be loaded
  ERROR_TYPE_INTERNAL = 7;           // an unexpected server error
}

// Predictions for one input. The top 5 by score are returned, plus any other
// label scoring above 0.90 (models with a `score_threshold` return the labels
// above it instead).
message Classification {
  repeated Prediction predictions = 1;
}

message Prediction {
  // The label's id: a class index (vit), a label-list index (siglip), or a
  // taxonomy category id.
  uint32 label = 1;
  // The label's name, e.g. "nsfw" or "food_and_drink.drinks".
  string name = 2;
  float score = 3;
}

// An image classifier run over a video's sampled frames.
message Scan {
  // Rolled up across samples by the strategy's aggregation (max or mean).
  Classification aggregated = 1;
  // Stretches where the model's trigger labels reached their threshold.
  repeated Segment segments = 2;
  // Every classified sample, in time order. Only with RESULT_VIEW_FULL.
  repeated Sample samples = 3;
  // How many samples were classified (also when `samples` is left out).
  uint32 sample_count = 4;
}

// Text a model read.
message TextOutput {
  // All of it: an image's text, or a video's parts joined by newlines.
  string text = 1;
  // The text's language, when the model reports one (empty for OCR).
  string language = 2;
  // For a video, where each part of the text appears, in time order: text
  // repeated on consecutive sampled frames is one part. Empty for an image.
  repeated TimedText parts = 3;
}

// Text seen from `start` to `end` (the first and last sampled frame it was
// read on), in seconds.
message TimedText {
  double start = 1;
  double end = 2;
  string text = 3;
}

// One classified sample: a video frame (`start` == `end`), or a part of a
// video's text (from its first to its last frame).
message Sample {
  // Position in processing order.
  uint32 index = 1;
  // Seconds into the media.
  double start = 2;
  double end = 3;
  Classification classification = 4;
}

// A stretch of the media where a trigger label (the model's `early_exit`
// labels) reached its threshold on consecutive samples.
message Segment {
  uint32 label = 1;
  string name = 2;
  // First and last flagged sample, in seconds.
  double start = 3;
  double end = 4;
  // Highest score in the segment, and where it was.
  float peak = 5;
  double peak_at = 6;
  // Flagged samples in the segment.
  uint32 samples = 7;
  // The nearest sample below the threshold on either side (or the media's
  // start/end): the segment may extend that far, since nothing between was
  // sampled.
  double bound_start = 8;
  double bound_end = 9;
}
