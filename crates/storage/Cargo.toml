[package]
name = "apollo-storage"
version.workspace = true
edition.workspace = true

[dependencies]
apollo-domain = { path = "../domain" }
apollo-config = { path = "../config" }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite"] }
async-trait = "0.1"
serde_json = "1"
thiserror = "2"
# SurrealDB backend (remote server over ws(s)/http(s)).
surrealdb = { version = "4.0", default-features = false, features = ["protocol-ws", "protocol-http", "rustls"] }
# For `testing` (the `test-util` feature) only.
tokio = { workspace = true, features = ["time"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"], optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tempfile = "3"
# The workspace links two rustls backends, so the SurrealDB test picks one before
# a wss:// URL needs it (the binary does this in main).
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }

[features]
# `apollo_storage::testing` (a throwaway SurrealDB database), for other
# crates' tests only.
test-util = ["dep:tokio", "dep:rustls"]
