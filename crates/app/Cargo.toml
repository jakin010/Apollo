[package]
name = "apollo"
version.workspace = true
edition.workspace = true

[[bin]]
name = "apollo"
path = "src/main.rs"

[dependencies]
apollo-config  = { path = "../config" }
apollo-engine  = { path = "../engine" }
apollo-server  = { path = "../server" }
apollo-storage = { path = "../storage" }
clap = { version = "4", features = ["derive"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time", "net", "io-util"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
libc = "0.2"
pasetors = "0.7"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[features]
# Build the binary with GPU support: `cargo build -p apollo --features cuda`.
cuda = ["apollo-engine/cuda", "apollo-server/cuda"]
