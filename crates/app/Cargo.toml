[package]
name = "apollo"
version.workspace = true
edition.workspace = true

[[bin]]
name = "apollo"
path = "src/main.rs"

[dependencies]
apollo-config  = { path = "../config" }
apollo-domain  = { path = "../domain" }
apollo-engine  = { path = "../engine" }
apollo-inference = { path = "../inference" }
apollo-media   = { path = "../media" }
apollo-server  = { path = "../server" }
apollo-storage = { path = "../storage" }
clap = { version = "4", features = ["derive"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time", "net", "io-util", "sync"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
async-trait = "0.1"
libc = "0.2"
pasetors = "0.7"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The Prometheus `/metrics` listener. Already in the tree (tonic routes with it).
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }
# The health listener, with a header-read timeout (axum::serve sets none).
# Already in the tree under axum.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }

[target.'cfg(target_os = "linux")'.dependencies]
mimalloc = "0.1"

[dev-dependencies]
tempfile = "3"
# SurrealScratch, for the shared-key test against SurrealDB.
apollo-storage = { path = "../storage", features = ["test-util"] }
# Stalled storage, for the health probe tests.
apollo-engine = { path = "../engine", features = ["test-util"] }
tonic = { workspace = true }

[features]
# Build the binary with GPU support: `cargo build -p apollo --features cuda`.
cuda = ["apollo-engine/cuda", "apollo-server/cuda"]
# Faster CPU inference that moves scores in the last digits; off by default.
# See "CPU speed features" in docs/configuration.md.
accelerate = ["apollo-inference/accelerate"]
avx512 = ["apollo-inference/avx512"]
fast-gelu = ["apollo-inference/fast-gelu"]
