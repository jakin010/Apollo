[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/config",
    "crates/proto",
    "crates/storage",
    "crates/inference",
    "crates/media",
    "crates/engine",
    "crates/server",
    "crates/client",
    "crates/app",
]

[workspace.package]
version = "1.0.0"
edition = "2024"

[workspace.dependencies]
tonic = { version = "0.14" }
tracing = { version = "0.1" }
tokio = { version = "1.52", default-features = false }

# `cargo build --profile profiling` / `cargo flamegraph --profile profiling`:
# release optimizations with full debug info, so profilers and flamegraphs show
# real function names and source lines. Output goes to target/profiling/.
[profile.profiling]
inherits = "release"
debug = true
strip = false

# candle comes from our fork's `apollo` branch, Apollo's own line of candle 0.11.
# Among other things, its Metal strided kernels (copies, broadcast ops) use
# 32-bit index math instead of 64-bit, which makes ViT inference on Metal ~2x
# faster (upstream PR pending). All four crates come from it, so they stay in step.
[patch.crates-io]
candle-core = { git = "https://github.com/jakin010/candle", branch = "apollo" }
candle-nn = { git = "https://github.com/jakin010/candle", branch = "apollo" }
candle-transformers = { git = "https://github.com/jakin010/candle", branch = "apollo" }
candle-metal-kernels = { git = "https://github.com/jakin010/candle", branch = "apollo" }
# gemm-common (candle's CPU matmuls, through gemm) from our gemm fork's `apollo`
# branch: gemm 0.19.0 plus a patch that keeps small matmuls on the AVX2 kernels
# when the `avx512` feature is on, where AVX-512 would be up to 3x slower. Only
# affects x86-64 builds with `avx512`; scores are otherwise bit-identical.
gemm-common = { git = "https://github.com/jakin010/gemm", branch = "apollo" }
